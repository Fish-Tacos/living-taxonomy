name: daily-taxonomy
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python taxonomy.py
      - name: Commit updated tree
        run: |
          git config user.name "taxonomy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "taxonomy $(date -u +%F)"
          git push
